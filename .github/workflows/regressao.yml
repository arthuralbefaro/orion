name: regressao

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regressao:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make qemu-system-x86 ovmf python3-pil

      - name: KVM, se o runner tiver
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "sem /dev/kvm: o QEMU roda em TCG e os prazos da regressao sobem"
          fi

      - name: Zig 0.16.0 (musl)
        run: |
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c
          mkdir -p third_party/zig
          tar -xJf zig.tar.xz -C third_party/zig --strip-components=1

      - name: Rust (no_std)
        run: rustup target add x86_64-unknown-none

      - name: Build
        run: make -j"$(nproc)"

      - name: Regressao completa
        run: python3 tools/regress.py ABCDFIVNUSGWHPZMKRE

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs
          path: |
            out/*.log
            out/shots/*.png
